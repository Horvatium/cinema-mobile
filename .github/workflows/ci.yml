name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # Sestavi JavaScript za Android enako kot gradnja za izdajo, kar ujame
      # pokvarjene uvoze in skladenjske napake brez nativne gradnje
      - name: Bundle for Android
        run: npx expo export --platform android --output-dir dist
